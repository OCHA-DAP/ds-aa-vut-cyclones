[project]
name = "ds-aa-vut-cyclones"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "geopandas",
    "html2text",
    "jinja2",
    "marimo",
    "matplotlib",
    "numpy",
    "ocha-stratus",
    "pandas",
    "plotly",
    "requests",
    "rioxarray",
    "tqdm",
    "xarray",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "ipykernel",
    "isort",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
