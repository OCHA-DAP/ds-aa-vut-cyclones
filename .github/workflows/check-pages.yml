# The trigger pages must keep showing the framework's figures: docs/trigger/
# is linked from the published framework document. Runs the stdlib-only test
# that compares the page data with the framework's Annex 2 table and Trigger
# Mechanism Statistics.
name: Check pages against the framework

on:
  pull_request:
    paths:
      - "docs/**"
      - "tests/test_pages_framework.py"
      - ".github/workflows/check-pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/test_pages_framework.py"
      - ".github/workflows/check-pages.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_pages_framework.py -q
