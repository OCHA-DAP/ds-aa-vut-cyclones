<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vanuatu cyclone trigger summary slides</title>
<link rel="icon" href="../favicon.ico" />
<link rel="stylesheet" href="../assets/historical.css" />
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --surface-2: #f2f2ef; --border: #d8d8d2;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #767570;
  --critical: #c02526; --critical-pale: #f2c9c9;
  --grey-head: #e4e4e0; --impact: #8e44ad; --cerf-blue: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #262625; --border: #3d3d3a;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #9a998f;
    --critical: #e66767; --critical-pale: #5c2f2f;
    --grey-head: #33332f; --impact: #a86fc7; --cerf-blue: #3987e5;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--surface-2);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text-primary); }
.deck { height: 100%; overflow: hidden; position: relative; }
.slide {
  position: absolute; inset: 0; display: none; overflow: auto;
  padding: 2.6rem 4.5rem 4rem; background: var(--surface-1);
}
.slide.active { display: block; }
.slide h1 { font-size: 1.75rem; margin: 0 0 .3rem; line-height: 1.2; }
.slide .sub { color: var(--text-secondary); margin: 0 0 1.3rem; font-size: 1rem; }
.slide h2 { font-size: 1.1rem; margin: 1.5rem 0 .5rem; }
.opt {
  display: inline-block; padding: .05em .55em; border-radius: 4px;
  background: var(--grey-head); font-size: .95rem; vertical-align: middle;
}

table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { border: 1px solid var(--border); padding: .45rem .65rem; text-align: left;
  vertical-align: middle; }
thead th { background: var(--grey-head); font-weight: 650; }
.center { text-align: center; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

.trig-def td.big { font-size: 1.05rem; font-weight: 650; text-align: center; }

.muted { color: var(--text-muted); font-weight: 400; font-size: .85rem; }

.footnote { color: var(--text-muted); font-size: .78rem; margin-top: .9rem; max-width: 100ch; }

.nav {
  position: fixed; bottom: 1rem; right: 1.3rem; z-index: 10;
  display: flex; gap: .4rem; align-items: center;
  color: var(--text-muted); font-size: .85rem;
}
.nav button {
  font: inherit; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text-primary);
  border-radius: 4px; width: 2.1rem; height: 2rem;
}
.brand {
  position: fixed; bottom: 1rem; left: 1.3rem; z-index: 10;
  color: var(--text-muted); font-size: .8rem;
}
/* back to the site landing page (team Pages convention); fixed, as the deck fills the window */
.home-link { position: fixed; top: .6rem; left: .8rem; z-index: 10;
  padding: 6px 12px; font: 500 13px/1 'Roboto', system-ui, sans-serif; color: #1e795f;
  background: #e9f5f1; border: 1px solid #d4eae4; border-radius: 4px;
  text-decoration: none; }
.home-link:hover { background: #d4eae4; }
@media print {
  .slide { position: static; display: block; page-break-after: always; }
  .nav, .brand, .home-link { display: none; }
}
</style>
</head>
<body>
<a class="home-link" href="../">&larr; Vanuatu cyclone anticipatory action</a>
<div class="deck" id="deck"></div>

<div class="brand">Vanuatu AA — cyclones &middot; framework endorsed Oct 2026 &middot;
  <a href="../trigger/" style="color:inherit">historical activations</a> &middot;
  <a href="../forecast-check/" style="color:inherit">technical analysis</a></div>
<div class="nav">
  <button id="prev" aria-label="Previous slide">&larr;</button>
  <span id="pos">1 / 2</span>
  <button id="next" aria-label="Next slide">&rarr;</button>
</div>

<script src="../assets/historical.js"></script>
<script>
const { T, fmt } = VutRecord;

/* ---------- slide builders ---------- */

function trigDefTable(T) {
  return `
  <table class="trig-def">
    <thead>
      <tr><th>Trigger</th><th>Leadtime</th><th>Wind speed</th>
          <th>Number of people exposed</th><th>Provinces</th><th>Data source</th></tr>
    </thead>
    <tbody>
      <tr>
        <td><strong>Readiness</strong></td>
        <td>72 to 120 hours</td>
        <td class="big" rowspan="3">&ge; 64 knots<br>
          <span class="muted">(10-minute mean)</span></td>
        <td class="big" rowspan="3">&ge; ${fmt(T)} people</td>
        <td rowspan="2">Shefa, Sanma, Tafea</td>
        <td>RSMC Nadi extended track forecast</td>
      </tr>
      <tr>
        <td><strong>Action</strong></td>
        <td>24 to 72 hours</td>
        <td>VMHS track forecast</td>
      </tr>
      <tr>
        <td><strong>Observational</strong></td>
        <td>n/a</td>
        <td>All of Vanuatu</td>
        <td>VMHS observed track</td>
      </tr>
    </tbody>
  </table>`;
}

function defSlide(rp) {
  return `
  <h1>Vanuatu anticipatory action — tropical cyclones</h1>
  <p class="sub">Trigger mechanism &middot; framework endorsed by the ERC, 15 October 2026</p>
  <h2>Trigger definition</h2>
  ${trigDefTable(T)}
  ${VutRecord.tmsPanel(rp)}
  <p class="footnote">
    Backtest record: ${rp.first_season}&ndash;${rp.last_season}. IBTrACS 64-kt radii exist
    reliably from 2005; season 2005 itself is excluded (its forecast archive is a single
    anomalous year). Forecast legs scored where JTWC decks survive (2012&ndash;2025); the six
    2006&ndash;11 seasons are unscorable and carried as ${rp.combined.extra_default ?? 1}
    assumed activation. All wind thresholds on the 10-minute scale (evaluated at the 73-kt
    1-min-equivalent contour in JTWC/IBTrACS data).
  </p>`;
}

function stormSlide(rp, hist) {
  return `
  <h1>Historical storms near Vanuatu, ${hist.first_season}&ndash;${hist.last_season}</h1>
  <p class="sub">Exposure to &ge;64&nbsp;kt (10-min) winds &middot;
    <span style="color:var(--critical);font-weight:650">red</span> = trigger threshold met
    (&ge;${fmt(T)} people) &middot;
    <span style="background:var(--critical-pale);padding:0 .35em;border-radius:2px">pale red</span>
    = no forecast record survives, one assumed activation</p>
  ${VutRecord.annexTable(rp, hist)}
  <p class="footnote">
    Forecast exposure: JTWC official forecasts (RSMC Nadi and VMHS forecasts are not archived
    with wind radii), 24&ndash;72&nbsp;h track segment, WorldPop population inside the
    forecast 64&nbsp;kt swath in Shefa/Sanma/Tafea, at the 73&nbsp;kt 1-min-equivalent speed.
    Observed exposure: IBTrACS best-track radii, same speed, whole country. *Gene 2008 and
    Atu 2011: observed swaths reached or nearly reached the AOI, but there are no forecast
    records for 2006&ndash;11, so they count as one assumed activation. Both caused damage
    that EM-DAT does not record for Vanuatu (Gene: severe damage on Futuna, in the AOI; Atu:
    damage on outer islands, transport halted). Donna 2017 mainly affected the Torres Islands
    (population about 1,000), too few people to reach a people-exposed threshold. Storms
    shown: all with any 64-kt exposure, people affected or a CERF allocation, plus the next
    closest storms (largest observed exposure to 34-kt winds).
  </p>`;
}

/* ---------- assemble deck ---------- */
Promise.all([
  fetch("../forecast-check/data/rp.json").then((r) => r.json()),
  fetch("../forecast-check/data/hist.json").then((r) => r.json()),
]).then(([rp, hist]) => {
  const deck = document.getElementById("deck");
  const slidesHtml = [defSlide(rp), stormSlide(rp, hist)];
  deck.innerHTML = slidesHtml.map((h, i) =>
    `<section class="slide${i === 0 ? " active" : ""}">${h}</section>`).join("");

  const slides = [...deck.querySelectorAll(".slide")];
  let cur = 0;
  const show = (i) => {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, j) => s.classList.toggle("active", j === cur));
    document.getElementById("pos").textContent = `${cur + 1} / ${slides.length}`;
    history.replaceState(null, "", "#" + (cur + 1));
  };
  document.getElementById("prev").addEventListener("click", () => show(cur - 1));
  document.getElementById("next").addEventListener("click", () => show(cur + 1));
  document.addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " "].includes(e.key)) show(cur + 1);
    if (["ArrowLeft", "PageUp"].includes(e.key)) show(cur - 1);
  });
  const h = parseInt((location.hash || "").slice(1), 10);
  if (h >= 1 && h <= slides.length) show(h - 1);
});
</script>
</body>
</html>
